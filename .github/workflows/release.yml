name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release_meta:
    name: Validate Release Tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      prerelease: ${{ steps.classify.outputs.prerelease }}
      update_latest: ${{ steps.classify.outputs.update_latest }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate release tag matches apps/gateway version
        run: |
          APP_VERSION=$(awk -F '"' '/^version = / {print $2; exit}' apps/gateway/Cargo.toml)
          if [ -z "${APP_VERSION}" ]; then
            echo "Could not determine version from apps/gateway/Cargo.toml" >&2
            exit 1
          fi
          if [ "v${APP_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match apps/gateway version v${APP_VERSION}" >&2
            exit 1
          fi

      - name: Classify release tag
        id: classify
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "update_latest=true" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-.+ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "update_latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported release tag format: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

  build:
    permissions:
      contents: read
    name: Build ${{ matrix.display }}
    needs: release_meta
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            display: Linux x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            display: Linux ARM64
          - target: x86_64-apple-darwin
            os: macos-latest
            display: macOS x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            display: macOS ARM64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            display: Windows x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Configure linker for Linux ARM
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++" >> $GITHUB_ENV

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          binary_name="brain3"
          if [[ "${{ matrix.target }}" == *-windows-* ]]; then
            binary_name="brain3.exe"
          fi

          tar -czf brain3-${{ matrix.target }}.tar.gz \
            -C target/${{ matrix.target }}/release \
            "$binary_name"

      - uses: actions/upload-artifact@v4
        with:
          name: brain3-${{ matrix.target }}
          path: brain3-${{ matrix.target }}.tar.gz

  release:
    name: Create GitHub Release
    needs:
      - prepare-assets
      - release_meta
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          name: release-assets

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          prerelease: ${{ needs.release_meta.outputs.prerelease == 'true' }}

  prepare-assets:
    name: Prepare Release Assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate signed release manifest
        env:
          BRAIN3_RELEASE_SIGNING_KEY_PEM_B64: ${{ secrets.BRAIN3_RELEASE_SIGNING_KEY_PEM_B64 }}
        run: |
          if [ -z "${BRAIN3_RELEASE_SIGNING_KEY_PEM_B64}" ]; then
            echo "Missing required secret: BRAIN3_RELEASE_SIGNING_KEY_PEM_B64" >&2
            exit 1
          fi

          KEY_FILE="$(mktemp)"
          trap 'rm -f "$KEY_FILE"' EXIT

          umask 177
          printf '%s' "${BRAIN3_RELEASE_SIGNING_KEY_PEM_B64}" | base64 --decode > "$KEY_FILE"

          RELEASE_SIGNING_KEY_FILE="$KEY_FILE" \
            bash scripts/generate-release-manifest.sh artifacts

      - name: Verify signed release manifest
        run: |
          test -s artifacts/SHA256SUMS
          test -s artifacts/SHA256SUMS.sig
          openssl dgst -sha256 \
            -verify scripts/release-signing-public-key.pem \
            -signature artifacts/SHA256SUMS.sig \
            artifacts/SHA256SUMS
          (
            cd artifacts
            sha256sum -c SHA256SUMS
          )

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: artifacts/*

  publish-s3:
    name: Publish to S3
    needs:
      - prepare-assets
      - release_meta
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          name: release-assets

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Upload to S3
        env:
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
          BRAIN3_UPDATE_LATEST: ${{ needs.release_meta.outputs.update_latest }}
        run: |
          bash scripts/upload-to-s3.sh \
            "${{ secrets.BRAIN3_S3_BUCKET }}" \
            "${{ github.ref_name }}" \
            artifacts
