name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions: read-all

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Check brain3-mcp-vault-tools lockfile
        run: uv lock --project ./brain3-mcp-vault-tools --check

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        if: github.event_name == 'push'
        run: cargo build --release

      - name: Test
        run: cargo test

      - name: Verify README systemd unit
        run: |
          cargo build -p brain3
          unit="$RUNNER_TEMP/brain3.service"
          awk '/^<!-- brain3[.]service -->$/ { getline; in_unit = 1; next }
               in_unit && /^```$/ { exit }
               in_unit { print }' README.MD > "$unit"
          test -s "$unit"
          export BRAIN3_CI_HOME="$HOME" BRAIN3_CI_USER="$(id -un)" BRAIN3_CI_BIN="$PWD/target/debug/brain3"
          python - "$unit" <<'PY'
          import os
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          unit = path.read_text().replace(
              "/home/brain3user/.local/bin/brain3", os.environ["BRAIN3_CI_BIN"]
          ).replace("/home/brain3user", os.environ["BRAIN3_CI_HOME"]).replace(
              "User=brain3user", "User=" + os.environ["BRAIN3_CI_USER"]
          )
          path.write_text(unit)
          PY
          systemd-analyze --recursive-errors=one verify "$unit"

      - name: Release signing smoke test
        run: bash scripts/test-release-signing.sh

  windows-native-audio-spike:
    name: Windows native audio dependency spike
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-native-audio-spike

      - name: Build brain3-platform test targets
        run: cargo test -p brain3-platform --no-run
